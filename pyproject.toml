[project]
name = "hn"
version = "0.2.0"
description = "Early engagement prediction on Hacker News from snapshot trajectories"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "jupyter",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hn"]
